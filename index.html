<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WTW COACH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>WTW COACH</title>
<style>
:root{--bg:#08152e;--panel:#102447;--panel2:#16315b;--line:#284575;--blue:#1c55b5;--white:#f6f8ff;--muted:#a9b9d6;--gold:#dbe7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -5%,#173c75,transparent 38%),var(--bg);color:var(--white);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:850px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(35px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:6px 0 24px}.mark{width:53px;height:53px;border-radius:13px;object-fit:cover;background:white}.brand{font-weight:950;font-size:25px;letter-spacing:1px}.brand span{color:#8db7ff}.subtitle{font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:900}
.panel{background:linear-gradient(145deg,#132b50,#0d1d39);border:1px solid var(--line);border-radius:19px;padding:18px;margin-bottom:14px;box-shadow:0 12px 28px #0003}
h1{font-size:30px;line-height:1.1;margin:7px 0}h2{font-size:19px;margin:0 0 13px}h3{font-size:15px;margin:0}.muted,.small{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#9cb6df;font-weight:900}
.btn{background:#e8f0ff;color:#09204a;border:0;border-radius:12px;padding:12px 16px;font-weight:900}.btn.secondary{background:#18345f;color:var(--white);border:1px solid var(--line)}.btn.danger{background:#552a3b;color:#ffe4eb}
input,textarea,select{width:100%;background:#081832;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;outline:none}label{display:block;font-size:12px;color:#c4d4ef;font-weight:800;margin:12px 0 6px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}.tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:9px 13px;font-weight:800}.tab.active{background:#e8f0ff;color:#09204a;border-color:#e8f0ff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#0b1b36;border:1px solid var(--line);border-radius:11px;text-align:center;padding:9px 2px}.day.today{background:#e8f0ff;color:#09204a}.dow{font-size:9px;font-weight:900}.num{font-size:18px;font-weight:900}.dot{width:6px;height:6px;border-radius:50%;background:#9ec0ff;margin:4px auto}.today .dot{background:#09204a}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:13px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#0b1b36;border:1px solid var(--line);border-radius:13px;padding:13px}.metric strong{display:block;font-size:27px}.metric span{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:900}
.training{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.training:last-child{border:0}.stripe{width:4px;height:43px;background:#9ec0ff;border-radius:4px}.main{flex:1;min-width:0}.main p{font-size:13px;color:var(--muted);margin:4px 0}.duration{font-size:11px;color:var(--muted);white-space:nowrap}.empty{border:1px dashed #49618a;border-radius:13px;padding:20px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.notice{font-size:12px;color:#c7d7f2;background:#0a1a34;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.week{gap:4px}.day{padding:8px 1px}.num{font-size:16px}.brand{font-size:22px}}
</style></head>
<body><div class="wrap">
<header><img class="mark" src="icons/icon-180.png" alt="Logo WTW"><div><div class="brand">WTW <span>COACH</span></div><div class="subtitle">TWÓJ TRENING. TWÓJ POSTĘP.</div></div></header>
<div class="eyebrow">TWOJE OSOBISTE CENTRUM TRENINGOWE</div><h1>Trenuj. Zapisuj. Rozwijaj się.</h1><p class="muted">Prywatny dziennik treningowy na Twoim iPhonie.</p>
<nav class="tabs"><button class="tab active" data-page="home">Start</button><button class="tab" data-page="calendar">Kalendarz</button><button class="tab" data-page="stats">Statystyki</button><button class="tab" data-page="backup">Kopia danych</button></nav>
<main id="page"></main>
<div class="notice">Twoje treningi są przechowywane lokalnie na tym urządzeniu. Regularnie eksportuj kopię zapasową w zakładce „Kopia danych”.</div>
</div>
<script>
const $=id=>document.getElementById(id),KEY='wtw_coach_private_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),page='home',selected=new Date().toLocaleDateString('en-CA');
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function week(){let d=new Date(),n=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-n);return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return x})}
function strip(){return `<div class="week">${week().map(d=>{let s=d.toLocaleDateString('en-CA'),today=s===new Date().toLocaleDateString('en-CA'),has=data.some(t=>t.date===s);return `<div class="day ${today?'today':''}"><div class="dow">${['ND','PN','WT','ŚR','CZW','PT','SOB'][d.getDay()]}</div><div class="num">${d.getDate()}</div><div class="dot" style="visibility:${has?'visible':'hidden'}"></div></div>`}).join('')}</div>`}
function card(t){return `<div class="training"><div class="stripe"></div><div class="main"><h3>${esc(t.name)}</h3><div class="small">${esc(t.kind)} · ${new Date(t.date+'T12:00:00').toLocaleDateString('pl-PL')}</div>${t.notes?`<p>${esc(t.notes)}</p>`:''}</div><span class="duration">${t.minutes} min</span><button class="tab" onclick="removeItem('${t.id}')">✕</button></div>`}
function render(){let a=[...data].sort((x,y)=>y.date.localeCompare(x.date)),today=new Date().toLocaleDateString('en-CA'),days=week().map(d=>d.toLocaleDateString('en-CA'));
if(page==='home')$('page').innerHTML=`<section class="panel"><div class="row"><h2>Twój tydzień</h2><span class="small">${new Date().toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}</span></div>${strip()}</section><div class="grid"><section class="panel"><h2>Dzisiejszy trening</h2>${a.filter(t=>t.date===today).map(card).join('')||`<div class="empty"><h3>Brak dzisiejszego treningu</h3><p>Dodaj swoją aktywność.</p><button class="btn" onclick="openForm('${today}')">＋ DODAJ TRENING</button></div>`}</section><div class="metrics"><div class="metric"><span>W TYM TYGODNIU</span><strong>${a.filter(t=>days.includes(t.date)).length}</strong></div><div class="metric"><span>WSZYSTKIE TRENINGI</span><strong>${a.length}</strong></div></div></div><section class="panel"><h2>Ostatnie treningi</h2>${a.slice(0,6).map(card).join('')||'<div class="empty">Tutaj pojawią się zapisane treningi.</div>'}</section><button class="btn" onclick="openForm('${today}')">＋ DODAJ TRENING</button>`;
if(page==='calendar')calendar(a);if(page==='stats')stats(a,days);if(page==='backup')backup()}
function calendar(a){let list=a.filter(t=>t.date===selected);$('page').innerHTML=`<section class="panel"><h2>Kalendarz treningów</h2><label>Wybierz datę</label><input id="pick" type="date" value="${selected}"></section><section class="panel"><div class="row"><h2>Treningi z wybranego dnia</h2><button class="btn" onclick="openForm('${selected}')">＋ Dodaj</button></div>${list.map(card).join('')||'<div class="empty">Brak treningów w tym dniu.</div>'}</section><section class="panel"><h2>Cała historia</h2>${a.map(card).join('')||'<div class="empty">Brak zapisanych treningów.</div>'}</section>`;$('pick').onchange=e=>{selected=e.target.value;render()}}
function stats(a,days){let mins=a.reduce((s,t)=>s+(+t.minutes||0),0);$('page').innerHTML=`<section class="panel"><h2>Twoje statystyki</h2><div class="metrics"><div class="metric"><span>ŁĄCZNIE TRENINGÓW</span><strong>${a.length}</strong></div><div class="metric"><span>W TYM TYGODNIU</span><strong>${a.filter(t=>days.includes(t.date)).length}</strong></div><div class="metric"><span>ŁĄCZNY CZAS</span><strong>${mins}</strong><small class="muted">minut</small></div><div class="metric"><span>ŚREDNIO</span><strong>${a.length?Math.round(mins/a.length):0}</strong><small class="muted">min na trening</small></div></div></section><section class="panel"><h2>Aktywność w tygodniu</h2>${week().map(d=>{let s=d.toLocaleDateString('en-CA'),n=a.filter(t=>t.date===s).length;return `<div class="row small"><span>${d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric'})}</span><b>${n}</b></div><div style="height:7px;background:#081832;border-radius:8px;margin:6px 0 13px"><div style="height:7px;width:${Math.min(100,n*25)}%;background:#9ec0ff;border-radius:8px"></div></div>`}).join('')}</section>`}
function backup(){$('page').innerHTML=`<section class="panel"><h2>Kopia zapasowa</h2><p class="muted">Zapisz plik z treningami, aby móc je później przywrócić.</p><button class="btn" onclick="exportData()">POBIERZ KOPIĘ DANYCH</button><label style="margin-top:20px">Przywróć kopię z pliku JSON</label><input id="restore" type="file" accept="application/json"><button class="btn secondary" style="margin-top:10px" onclick="importData()">PRZYWRÓĆ DANE</button></section><section class="panel"><h2>Ustawienia</h2><p class="muted">Liczba zapisanych treningów: ${data.length}</p><button class="btn danger" onclick="if(confirm('Na pewno usunąć wszystkie treningi?')){data=[];save();render()}">USUŃ WSZYSTKIE TRENINGI</button></section>`}
function openForm(date){$('page').insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:14px;z-index:5"><form id="entry" class="panel" style="width:min(550px,100%);max-height:92vh;overflow:auto"><div class="row"><h2>Dodaj trening</h2><button type="button" class="tab" onclick="$('modal').remove()">✕</button></div><label>Nazwa treningu *</label><input name="name" required maxlength="70" placeholder="Np. Trening siłowy"><label>Rodzaj aktywności</label><select name="kind">${['Trening siłowy','Bieganie','Jazda na rowerze','Pływanie','Piłka nożna','Koszykówka','Spacer','Rozciąganie','Inny trening'].map(x=>`<option>${x}</option>`).join('')}</select><div class="formgrid"><div><label>Data</label><input name="date" type="date" value="${date}" required></div><div><label>Czas trwania (minuty)</label><input name="minutes" type="number" min="0" max="1440" value="45"></div><div class="full"><label>Opis wykonanych ćwiczeń</label><textarea name="notes" rows="4" maxlength="1000" placeholder="Co ćwiczyłeś?"></textarea></div></div><div class="actions"><button class="btn">ZAPISZ TRENING</button><button type="button" class="btn secondary" onclick="$('modal').remove()">Anuluj</button></div></form></div>`);$('entry').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.push({id:Date.now().toString()+Math.random(),name:f.get('name').trim(),kind:f.get('kind'),date:f.get('date'),minutes:Math.max(0,+f.get('minutes')||0),notes:f.get('notes').trim()});save();selected=f.get('date');$('modal').remove();render()}}
function removeItem(id){if(confirm('Usunąć ten trening?')){data=data.filter(t=>t.id!==id);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WTW-COACH-kopia.json';a.click();URL.revokeObjectURL(url)}
function importData(){let f=$('restore').files[0];if(!f)return alert('Najpierw wybierz plik kopii.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x)||!x.every(t=>t&&t.name&&t.date))throw Error();if(confirm('Zastąpić obecne treningi danymi z kopii?')){data=x;save();render()}}catch(e){alert('Nieprawidłowy plik kopii.')}};r.readAsText(f)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
